[project]
name = "ratatouille-os-ai"
version = "0.1.0"
description = "鼠於我的小餐館 — AI service (Agent / MCP / Skills / RAG)"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "bm25s==0.3.16",
    "faiss-cpu==1.15.1",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "numba==0.68.1",
    "numpy==2.5.4",
    "pdfplumber==0.11.10",
    "pydantic-settings==2.16.2",
    "pypdf==6.21.4",
    "python-multipart==0.0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
